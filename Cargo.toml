[package]
name = "kptui"
version = "0.16.0"
edition = "2024"
rust-version = "1.97"
description = "TUI password manager for KeePass vaults"
authors = ["Pombo <https://github.com/pomboverso>", "<github.com/pepa65>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/pepa65/kptui"
readme = "README.md"
keywords = ["password-manager", "keepass", "tui", "foss", "open-source"]
categories = ["command-line-utilities"]

[package.metadata.binstall]
pkg-url = "{repo}/releases/download/{version}/{name}"
pkg-fmt = "bin"
disabled-strategies = ["quick-install", "compile"]
target-family = "Linux"
target-arch = "X86_64"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
anyhow = "1"
toml = "1"
keepass = { version = "0.14", features = ["save_kdbx4", "totp"] }
chrono = "0.4"
unicode-width = "0.2"
zeroize = { version = "1", features = ["derive"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
