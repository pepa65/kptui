# Existing KDBX database to open (or new database to create)
database = "~/.local/share/kptui/default.kdbx"

# Optional KeePass keyfile [empty for password-only vaults]
keyfile = "~/.local/share/kptui/default.keyx"

# Argon2 KDF iterations (time cost) [default: 90]
kdf_iterations = 90

# Seconds of inactivity before exiting the app [0: never auto-exit]
auto_exit = 300

# Name of a theme installed in ~/.config/kptui/themes/
theme = "mélange_dark"
